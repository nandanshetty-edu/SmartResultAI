name: smart_result_ai
description: SmartResult AI - VTU Result Processing System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.2.8

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # File Picker
  file_picker: ^8.1.2

  # File Save
  file_selector: ^1.0.3

  # Open Downloaded File
  open_filex: ^4.5.0

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/